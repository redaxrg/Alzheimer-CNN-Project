{% extends "layout.html" %}
{% block content %}
<div class="text-center">
  <h1 class="text-success mb-4">✅ Confirmation de diagnostic enregistrée</h1>

  <div class="card shadow-lg mx-auto" style="max-width: 500px; background-color: #f5fdf6;">
    <div class="card-body">
      <h4 class="card-title mb-3">🧑‍⚕️ Patient ID : <strong>{{ patient_id }}</strong></h4>
      <p class="card-text fs-5">
        Diagnostic confirmé par le médecin :
        <span class="text-primary fw-bold">{{ confirmation }}</span>
      </p>
    </div>
  </div>

  <a href="/login" class="btn btn-outline-primary mt-4">
    🔐 Retour à l’écran de connexion
  </a>
</div>
{% endblock %}
