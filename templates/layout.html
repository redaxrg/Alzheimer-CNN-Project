<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>{{ title if title else 'Système d\'Analyse IRM' }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
  {% set connected = session.get('user_role') %}

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">🧠 NeuroAI Diagnostic</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="/patient">Importer & Analyser</a></li>
          <li class="nav-item"><a class="nav-link" href="#rdv">Rendez-vous</a></li>
        </ul>
        <div class="d-flex">
          {% if connected %}
            <span class="navbar-text text-white me-3">
              Connecté : {{ connected }}
            </span>
            <a class="btn btn-outline-light" href="/logout">🔓 Déconnexion</a>
          {% else %}
            <a class="btn btn-light" href="/login">Connexion</a>
          {% endif %}
        </div>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
